[package]
name = "audiobookphile-cli"
version = "0.1.0"
edition = "2021"
authors = ["Audiobookphile Engineering <dev@audiobookphile.org>"]
description = "High-performance native CLI toolkit for Audiobookphile monorepo audits, storage health, and database utilities"

[[bin]]
name = "audiobookphile"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
regex = "1.10"
colored = "2.1"
indicatif = "0.17"
chrono = "0.4"
anyhow = "1.0"
