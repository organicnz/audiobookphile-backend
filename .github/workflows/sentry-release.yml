name: Sentry Release (Backend)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  create-release:
    name: Create Sentry Release
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Sentry secrets
        id: secrets
        env:
          SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not configured — skipping Sentry release."
            echo "To enable issue-to-PR linking, add secrets.SENTRY_AUTH_TOKEN"
            echo "(scopes: project:read, project:write, project:releases, org:read)"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "Sentry secrets configured — proceeding with release."
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Sentry Release
        if: steps.secrets.outputs.available == 'true'
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'organicnz' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'audiobookphile-backend' }}
        with:
          environment: ${{ github.ref_name }}
          version: ${{ github.sha }}
          set_commits: auto
          ignore_missing: true
          ignore_empty: true
