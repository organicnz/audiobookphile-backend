name: PR Lifecycle & Quality Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  triage:
    name: PR Triage & Assignment
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - name: Apply Labels
        uses: actions/labeler@v5
        continue-on-error: true
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          sync-labels: true

      - name: Auto-assign PR to Creator
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.addAssignees({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                assignees: [context.payload.pull_request.user.login]
              });
            } catch (e) {
              console.log("Could not auto-assign author:", e.message);
            }

  auto-fix:
    name: Auto-Fix Formatting & Linting
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Lefthook pre-commit Auto-Fix
        run: bunx lefthook run pre-commit --all-files
        continue-on-error: true

      - name: Check for Modified Files
        id: git-check
        run: echo "modified=$(if git diff-index --quiet HEAD --; then echo "false"; else echo "true"; fi)" >> "$GITHUB_OUTPUT"

      - name: Commit Fixes
        if: steps.git-check.outputs.modified == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(ci): auto-fix formatting & linting issues [skip ci]'
          branch: ${{ github.head_ref }}
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          push_options: '--no-verify'

      - name: Notify on PR
        if: steps.git-check.outputs.modified == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✨ The PR Quality Pipeline auto-fixed formatting and pushed a clean commit. **Please `git pull` locally before making further edits!**'
            });

  ai-review:
    name: AI Architectural Review
    needs: triage
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Verify AI Credentials
        id: creds
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY secret not present; skipping AI review step."
          fi

      - name: AI Code Review
        if: steps.creds.outputs.available == 'true'
        uses: anc95/ChatGPT-CodeReview@v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: gpt-4o-mini
        with:
          debug: false
          review_comment_lgtm: false
          path_filters: |
            !dist/**
            !**/*.lockb
            !**/*.lock
            !package-lock.json
            !crates/cli/target/**
