name: Nightly Maintenance & Integrity Suite

on:
  schedule:
    - cron: "0 3 * * *" # Daily 03:00 UTC
  workflow_dispatch: {}

concurrency:
  group: nightly-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  backup:
    name: Database Snapshot Backup
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - name: Trigger Automated Backup
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          KEY="${CRON_SECRET:-$SUPABASE_SERVICE_ROLE_KEY}"
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$KEY" ]; then
            echo "::warning::Missing SUPABASE_PROJECT_ID or authorization key; skipping backup trigger."
            exit 0
          fi
          echo "Triggering backup edge function on $SUPABASE_PROJECT_ID..."
          response=$(curl -s -w "\n%{http_code}" -X POST "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/api/backup-database" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Status: $http_code"
          echo "Body: $body"
          if [ "$http_code" -ne 200 ] && [ "$http_code" -ne 201 ]; then
            echo "::error::Backup invocation failed with status $http_code"
            exit 1
          fi

  storage-reconcile:
    name: Intelligent Storage Reconciliation & Fixture Purge
    needs: backup
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - name: Trigger Storage Reconciliation
        id: reconcile
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          KEY="${CRON_SECRET:-$SUPABASE_SERVICE_ROLE_KEY}"
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$KEY" ]; then
            echo "::warning::Missing SUPABASE_PROJECT_ID or authorization key; skipping reconciliation trigger."
            exit 0
          fi
          echo "Triggering intelligent storage reconciliation on $SUPABASE_PROJECT_ID..."
          response=$(curl -s -w "\n%{http_code}" -X POST "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/api/admin/reconcile-storage" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"dryRun": false, "cleanTestData": true, "aiBudget": 8}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Status: $http_code"
          echo "Body: $body"
          if [ "$http_code" -ne 200 ] && [ "$http_code" -ne 201 ]; then
            echo "::error::Storage reconciliation failed with status $http_code"
            exit 1
          fi

          # The AI matching stage is budgeted so the function fits its worker
          # limit, which means a run can now legitimately stop early. A
          # truncated run must not be indistinguishable from a complete one --
          # that is exactly how the previous nightly failure (HTTP 546 every
          # night) went unnoticed. Warn loudly when work was deferred.
          skipped=$(echo "$body" | grep -o '"aiSkippedCount":[0-9]*' | cut -d: -f2)
          skipped="${skipped:-0}"
          if [ "$skipped" -gt 0 ]; then
            echo "::warning::${skipped} item(s) skipped AI matching: the model-call budget was exhausted. Deterministic reconciliation still completed for everything else. Re-run to continue, or raise aiBudget if the library grows."
          fi
          echo "body=$body" >> "$GITHUB_OUTPUT"

      # Write a compact summary so a green run is actually inspectable.
      - name: Summarise reconciliation
        if: always()
        run: |
          {
            echo "### Storage reconciliation"
            echo
            echo '```json'
            echo "${RECONCILE_BODY:-not captured}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          RECONCILE_BODY: ${{ steps.reconcile.outputs.body }}

  storage-quota:
    name: Storage Quota & Capacity Check
    needs: [backup, storage-reconcile]
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build & Run Rust Storage Health
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if command -v audiobookphile >/dev/null 2>&1; then
            audiobookphile storage-health
          elif [ -f crates/cli/target/release/audiobookphile ]; then
            crates/cli/target/release/audiobookphile storage-health
          else
            cargo run --manifest-path crates/cli/Cargo.toml --release -- storage-health
          fi

  integrity-audit:
    name: Detect Corrupted Library Items
    needs: storage-quota
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Item Integrity Detector
        id: detect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd supabase/functions
          deno run --allow-all detect_merged_books.ts --json "$RUNNER_TEMP/audit_report.json" 2>&1 | tee audit_output.txt
          SUSPECTS=$(grep -oE "SUSPECT_MERGED: [0-9]+" audit_output.txt | grep -oE "[0-9]+" || echo 0)
          echo "suspect_count=$SUSPECTS" >> "$GITHUB_OUTPUT"
          echo "Suspected merged items: $SUSPECTS"

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-integrity-report-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/audit_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run Merged-Books Split Scanner (report-only)
        id: split_scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          cd supabase/functions
          deno run --allow-all split_merged_books.ts --json "$RUNNER_TEMP/split_report.json" 2>&1 | tee split_output.txt
          SPLITS=$(grep -oE "split=[0-9]+" split_output.txt | grep -oE "[0-9]+" || echo 0)
          echo "split_count=$SPLITS" >> "$GITHUB_OUTPUT"
          echo "Items decided for split: $SPLITS (report-only; --apply is manual dispatch)"

      - name: Upload Split Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-split-report-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/split_report.json
          if-no-files-found: warn
          retention-days: 30

  error-remediation:
    name: Sentry Error Remediation & PR Generator
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      MAX_PRS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run LLM Error Remediation
        run: |
          if [ -z "${{ secrets.SENTRY_AUTH_TOKEN }}" ]; then
            echo "Warning: SENTRY_AUTH_TOKEN secret is missing — remediation will skip."
          fi
          if [ -z "${{ secrets.ZAI_API_KEY }}" ]; then
            echo "Warning: ZAI_API_KEY secret is missing — remediation will skip."
          fi
          deno run -A .github/scripts/remediate-errors.ts

