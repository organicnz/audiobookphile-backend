name: Library Consistency Review

# Recurring, read-only sweep of the library for the inconsistencies that make
# it look healthy in the database while behaving badly in the app: covers that
# point at objects which no longer exist, an is_missing flag that latched on
# after a transient failure, track counters that drifted, durations that
# disagree with their own track list.
#
# Reports only. It never writes, and it never fails the run, so a noisy audit
# cannot block a deploy. Findings are printed in the job summary; the on-demand
# repair workflows (repair-covers.yml) act on them.
#
# ZAI_API_KEY is not needed here: the vision-based cover check already runs on
# its own schedule in daily-compat.yml. This job is the cheap, deterministic
# half of the review.

on:
  schedule:
    # Twice a week, off the hour and off the daily cron peaks.
    - cron: "17 5 * * 1,4"
  workflow_dispatch:
    inputs:
      run_storage_checks:
        description: "Include the B2 object index (slower, needs tier credentials)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: library-review
  cancel-in-progress: false

jobs:
  review:
    name: Consistency Audit
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run library consistency audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Every configured tier must be wired here. An unwired tier is
          # silently skipped by isTierConfigured(), so a partial list makes the
          # audit report "no audio in storage" for books whose files live in an
          # unscanned bucket. Code name B2_QUINTET reads the B2_QUINTA_*
          # env prefix (see _shared/b2-config.ts).
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_SECONDARY_KEY_ID: ${{ secrets.B2_SECONDARY_KEY_ID }}
          B2_SECONDARY_APP_KEY: ${{ secrets.B2_SECONDARY_APP_KEY }}
          B2_SECONDARY_BUCKET_NAME: ${{ secrets.B2_SECONDARY_BUCKET_NAME }}
          B2_SECONDARY_ENDPOINT: ${{ secrets.B2_SECONDARY_ENDPOINT }}
          B2_SECONDARY_REGION: ${{ secrets.B2_SECONDARY_REGION }}
          B2_TERTIARY_KEY_ID: ${{ secrets.B2_TERTIARY_KEY_ID }}
          B2_TERTIARY_APP_KEY: ${{ secrets.B2_TERTIARY_APP_KEY }}
          B2_TERTIARY_BUCKET_NAME: ${{ secrets.B2_TERTIARY_BUCKET_NAME }}
          B2_TERTIARY_ENDPOINT: ${{ secrets.B2_TERTIARY_ENDPOINT }}
          B2_TERTIARY_REGION: ${{ secrets.B2_TERTIARY_REGION }}
          B2_QUARTET_KEY_ID: ${{ secrets.B2_QUARTET_KEY_ID }}
          B2_QUARTET_APP_KEY: ${{ secrets.B2_QUARTET_APP_KEY }}
          B2_QUARTET_BUCKET_NAME: ${{ secrets.B2_QUARTET_BUCKET_NAME }}
          B2_QUARTET_ENDPOINT: ${{ secrets.B2_QUARTET_ENDPOINT }}
          B2_QUARTET_REGION: ${{ secrets.B2_QUARTET_REGION }}
          B2_QUINTA_KEY_ID: ${{ secrets.B2_QUINTA_KEY_ID }}
          B2_QUINTA_APP_KEY: ${{ secrets.B2_QUINTA_APP_KEY }}
          B2_QUINTA_BUCKET_NAME: ${{ secrets.B2_QUINTA_BUCKET_NAME }}
          B2_QUINTA_ENDPOINT: ${{ secrets.B2_QUINTA_ENDPOINT }}
          B2_QUINTA_REGION: ${{ secrets.B2_QUINTA_REGION }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing Supabase credentials; cannot audit."
            exit 1
          fi
          # Honour the dispatch input. On a schedule `inputs` is empty, which
          # is not "false", so the default (scan storage) applies.
          if [ "${{ inputs.run_storage_checks }}" = "false" ]; then
            echo "run_storage_checks=false: auditing the database only."
            unset B2_KEY_ID B2_APP_KEY B2_BUCKET_NAME \
                  B2_SECONDARY_KEY_ID B2_SECONDARY_APP_KEY B2_SECONDARY_BUCKET_NAME \
                  B2_TERTIARY_KEY_ID B2_TERTIARY_APP_KEY B2_TERTIARY_BUCKET_NAME \
                  B2_QUARTET_KEY_ID B2_QUARTET_APP_KEY B2_QUARTET_BUCKET_NAME \
                  B2_QUINTA_KEY_ID B2_QUINTA_APP_KEY B2_QUINTA_BUCKET_NAME
          fi
          set -o pipefail
          deno run --allow-all scripts/library_review.ts 2>&1 | tee review.log

      - name: Verify storage tiers were actually scanned
        if: always()
        env:
          RUN_STORAGE_CHECKS: ${{ inputs.run_storage_checks }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_SECONDARY_KEY_ID: ${{ secrets.B2_SECONDARY_KEY_ID }}
          B2_TERTIARY_KEY_ID: ${{ secrets.B2_TERTIARY_KEY_ID }}
          B2_QUARTET_KEY_ID: ${{ secrets.B2_QUARTET_KEY_ID }}
          B2_QUINTA_KEY_ID: ${{ secrets.B2_QUINTA_KEY_ID }}
        run: |
          # A credential-less tier is skipped without warning, so an audit that
          # silently scanned zero buckets still looks like a clean pass. Say so
          # loudly instead: "no storage evidence" and "storage not scanned" are
          # very different findings.
          if [ -z "$B2_KEY_ID" ] && [ -z "$B2_SECONDARY_KEY_ID" ] && \
             [ -z "$B2_TERTIARY_KEY_ID" ] && [ -z "$B2_QUARTET_KEY_ID" ] && \
             [ -z "$B2_QUINTA_KEY_ID" ]; then
            {
              echo "## Storage checks skipped"
              echo
              echo "No B2 tier credentials are configured, so this run could not check"
              echo "storage at all. Any 'no audio found' finding below is unverified."
              echo
              echo 'Add the B2_* / B2_<TIER>_* repository secrets, or re-run with'
              echo 'run_storage_checks=false to record that intent.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::No B2 tier credentials configured; storage was not scanned"
          fi

      - name: Publish findings to the run summary
        if: always()
        run: |
          {
            echo "## Library consistency review"
            echo
            echo '```'
            # Skip the download/noise preamble; keep the report itself.
            sed -n '/^auditing /,$p' review.log || cat review.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-review
          path: review.log
          retention-days: 30
