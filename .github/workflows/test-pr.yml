name: Test PR Creation

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-pr:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create Test Branch and PR
        run: |
          git config user.name "audiobookphile-bot"
          git config user.email "bot@audiobookphile.app"
          
          BRANCH="bot/test-pr-creation-$(date +%s)"
          git checkout -b "$BRANCH"
          
          echo "Test" > test-pr.txt
          git add test-pr.txt
          git commit -m "chore: test PR creation"
          
          git push origin "$BRANCH"
          
          gh pr create \
            --draft \
            --title "chore: test PR creation capabilities" \
            --body "This is an automated test to verify that the GITHUB_TOKEN has the correct permissions to push branches and open draft PRs." \
            --head "$BRANCH" \
            --base main
