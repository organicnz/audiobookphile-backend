name: Repair Item Covers

# Targeted cover refetch for library items whose stored art is for the wrong
# book (provider search ranked a different work by the same author first —
# e.g. "The Prince" art on an "Art of War" item). fetchBookMetadata
# identity-gates every provider result, so a refetch can only store art for a
# plausibly-same work. Runs on demand with explicit item ids; never automatic.

on:
  workflow_dispatch:
    inputs:
      item_ids:
        description: "Comma-separated library_item ids to refetch covers for"
        required: true
        type: string
      force:
        description: "Re-fetch even when a cover object already exists (use to fix a cover showing the wrong book)"
        required: false
        default: false
        type: boolean
      vision_audit:
        description: "Run the vision-verified cover audit instead of the metadata refetch"
        required: false
        default: false
        type: boolean

# Read-only: the repair writes through the Supabase API, not the repository.
permissions:
  contents: read

concurrency:
  group: repair-covers
  cancel-in-progress: false

jobs:
  repair:
    name: Refetch Covers (gated)
    if: ${{ !inputs.vision_audit }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Refetch Covers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd supabase/functions
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
          deno run --allow-all repair_metadata.ts --apply --covers-only $FORCE_FLAG --ids "${{ inputs.item_ids }}"

  vision-audit:
    # Title matching cannot catch a provider returning the right title with the
    # wrong artwork (observed: iTunes returns trackName "Art War" for Machiavelli
    # but the cover image is "The Prince"). Only a vision model can tell, so
    # this runs the vision-verified audit, which re-fetches mismatched art and
    # falls back to an honest placeholder when nothing verifies.
    name: Vision Cover Audit (z.ai)
    if: ${{ inputs.vision_audit }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Vision Audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: deno run --allow-all scripts/cover_audit.ts

      - name: Upload Cover Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-audit-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
