name: Deploy Supabase Backend (Migrations & Edge API)

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  verify:
    name: Verify Deno Edge Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./supabase/functions/api
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno Lint
        run: deno lint index.ts routes/ _shared/

      - name: Deno Check (Type Safety)
        run: deno check index.ts

  deploy:
    name: Deploy to Supabase Production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Database Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID --password $SUPABASE_DB_PASSWORD
          supabase db push

      - name: Deploy Unified Edge API Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase functions deploy api --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt
