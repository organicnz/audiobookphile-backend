name: Deploy Supabase Backend (Migrations & Edge API)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Deno Edge Functions
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        working-directory: ./supabase/functions/api
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Deno
        id: deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: TruffleHog Secret Scanner
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        id: deps
        run: |
          . ${{ github.workspace }}/.github/scripts/step-tree.sh
          step_tree "Verify Deno Edge Functions" deps \
            "checkout:Checkout Repository|deno:Setup Deno|trufflehog:TruffleHog Secret Scanner|bun:Setup Bun|deps:Install Dependencies|pre_commit:Run Lefthook pre-commit|pre_push:Run Lefthook pre-push" \
            "checkout=${{ steps.checkout.outcome }};deno=${{ steps.deno.outcome }};trufflehog=${{ steps.trufflehog.outcome }};bun=${{ steps.bun.outcome }}"
          bun install --frozen-lockfile

      - name: Run Lefthook pre-commit
        id: pre_commit
        run: |
          . ${{ github.workspace }}/.github/scripts/step-tree.sh
          step_tree "Verify Deno Edge Functions" pre_commit \
            "checkout:Checkout Repository|deno:Setup Deno|trufflehog:TruffleHog Secret Scanner|bun:Setup Bun|deps:Install Dependencies|pre_commit:Run Lefthook pre-commit|pre_push:Run Lefthook pre-push" \
            "checkout=${{ steps.checkout.outcome }};deno=${{ steps.deno.outcome }};trufflehog=${{ steps.trufflehog.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }}"
          bunx lefthook run pre-commit --all-files

      - name: Run Lefthook pre-push
        id: pre_push
        run: |
          . ${{ github.workspace }}/.github/scripts/step-tree.sh
          step_tree "Verify Deno Edge Functions" pre_push \
            "checkout:Checkout Repository|deno:Setup Deno|trufflehog:TruffleHog Secret Scanner|bun:Setup Bun|deps:Install Dependencies|pre_commit:Run Lefthook pre-commit|pre_push:Run Lefthook pre-push" \
            "checkout=${{ steps.checkout.outcome }};deno=${{ steps.deno.outcome }};trufflehog=${{ steps.trufflehog.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};pre_commit=${{ steps.pre_commit.outcome }}"
          bunx lefthook run pre-push --all-files

  deploy:
    name: Deploy to Supabase Production
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]
    concurrency:
      group: deploy-backend-prod-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        id: cli
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Repair Migration History
        id: repair
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" repair \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|repair:Repair Migration History|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|vault:Provision Sentry Vault Secret|secrets:Ensure Edge Function Secrets|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }};repair=${{ steps.repair.outcome }}"
          # One-time repair: commit 5db4329 deleted applied migration files
          # from the repo, but the remote project still lists those versions
          # in its migration history, so `db push --include-all` fails with
          # "Remote migration versions not found in local migrations
          # directory". Mark them reverted once so the remote history matches
          # the (empty) local migrations dir. `|| true` is intentional: after
          # the first success the versions are gone and the CLI errors with
          # "not found in migration history" — the desired no-op.
          supabase link --project-ref $SUPABASE_PROJECT_ID --yes
          supabase migration repair --linked --status reverted 005 20260729000000 20260729010000 20260730000000 20260812000000 || true

      - name: Push Database Migrations
        id: migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" migrations \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|repair:Repair Migration History|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|vault:Provision Sentry Vault Secret|secrets:Ensure Edge Function Secrets|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }};repair=${{ steps.repair.outcome }}"
          # Migrations are pushed via the Management API (--linked) using
          # only the access token — no DB password secret required.
          supabase link --project-ref $SUPABASE_PROJECT_ID --yes
          supabase db push --linked --include-all --yes

      - name: Apply Auth & Email Configuration
        id: config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" config \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|repair:Repair Migration History|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|vault:Provision Sentry Vault Secret|secrets:Ensure Edge Function Secrets|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }};repair=${{ steps.repair.outcome }};migrations=${{ steps.migrations.outcome }}"
          # Push [auth] settings from supabase/config.toml — site_url,
          # redirect allow-list and the magic-link email template. Without
          # this, emailed sign-in links fall back to the dashboard default
          # site_url and never reach the web app.
          supabase link --project-ref $SUPABASE_PROJECT_ID --yes
          supabase config push --project-ref $SUPABASE_PROJECT_ID --yes

      - name: Ensure Email Provider Enabled
        id: email
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" email \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|repair:Repair Migration History|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|vault:Provision Sentry Vault Secret|secrets:Ensure Edge Function Secrets|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }};repair=${{ steps.repair.outcome }};migrations=${{ steps.migrations.outcome }};config=${{ steps.config.outcome }}"
          # The hosted project had the email (password) provider disabled,
          # so GoTrue rejects every password login with "Email logins are
          # disabled". Idempotently enable it — sign-ups stay blocked via
          # enable_signup = false (invitation-only).
          CURRENT=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('external_email_enabled', 'absent'))")
          if [ "$CURRENT" != "True" ]; then
            curl -s -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
              -d '{"external_email_enabled": true}'
            echo "EXTERNAL_EMAIL_ENABLED -> true (was $CURRENT)"
          else
            echo "EXTERNAL_EMAIL_ENABLED already true"
          fi

      - name: Ensure 2FA Challenge Signing Key Secret
        id: signing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" signing \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|repair:Repair Migration History|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|vault:Provision Sentry Vault Secret|secrets:Ensure Edge Function Secrets|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }};repair=${{ steps.repair.outcome }};migrations=${{ steps.migrations.outcome }};config=${{ steps.config.outcome }};email=${{ steps.email.outcome }}"
          # The 2FA challenge signing key is a project-level Edge Function
          # secret. Create it once if missing (idempotent — never rotated
          # here, otherwise in-flight login challenges would be rejected).
          EXISTING=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/secrets" \
            | python3 -c "import sys,json;print(any(s['name']=='2FA_CHALLENGE_SIGNING_KEY' for s in json.load(sys.stdin)))")
          if [ "$EXISTING" != "True" ]; then
            curl -s -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/secrets" \
              -d "[{\"name\":\"2FA_CHALLENGE_SIGNING_KEY\",\"value\":\"$(openssl rand -hex 32)\"}]"
            echo "2FA_CHALLENGE_SIGNING_KEY created"
          else
            echo "2FA_CHALLENGE_SIGNING_KEY already set"
          fi

      - name: Provision Sentry Vault Secret
        id: vault
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" vault \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|repair:Repair Migration History|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|vault:Provision Sentry Vault Secret|secrets:Ensure Edge Function Secrets|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }};repair=${{ steps.repair.outcome }};migrations=${{ steps.migrations.outcome }};config=${{ steps.config.outcome }};email=${{ steps.email.outcome }};signing=${{ steps.signing.outcome }}"
          # SENTRY_DSN lives in Supabase Vault (encrypted at rest), read at
          # runtime via public.read_secret() (vault_secret_reader migration).
          # Create it once if missing — idempotent and never rotated here so
          # deploys can't silently change observability.
          if [ -z "$SENTRY_DSN" ]; then
            echo "SENTRY_DSN GitHub secret not set — skipping Sentry Vault provisioning"
            exit 0
          fi
          SENTRY_DSN_ESCAPED=$(printf '%s' "$SENTRY_DSN" | sed "s/'/''/g")
          SQL="SELECT vault.create_secret('${SENTRY_DSN_ESCAPED}', 'SENTRY_DSN') WHERE NOT EXISTS (SELECT 1 FROM vault.decrypted_secrets WHERE name = 'SENTRY_DSN');"
          PAYLOAD=$(python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$SQL")
          HTTP_CODE=$(curl -sS -o /tmp/vault_resp.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            -d "$PAYLOAD")
          cat /tmp/vault_resp.json
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Sentry Vault provisioning failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "SENTRY_DSN ensured in Vault"

      - name: Ensure Edge Function Secrets
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" secrets \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|repair:Repair Migration History|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|vault:Provision Sentry Vault Secret|secrets:Ensure Edge Function Secrets|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }};repair=${{ steps.repair.outcome }};migrations=${{ steps.migrations.outcome }};config=${{ steps.config.outcome }};email=${{ steps.email.outcome }};signing=${{ steps.signing.outcome }};vault=${{ steps.vault.outcome }}"
          # NODE_ENV=production is an Edge Function secret (env var): it gates
          # the structured-logging and Sentry metrics/error-capture middleware,
          # and is read synchronously via Deno.env.get().
          EXISTING=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/secrets" \
            | python3 -c "import sys,json;print([s['name'] for s in json.load(sys.stdin)])")
          if ! echo "$EXISTING" | grep -q "NODE_ENV"; then
            curl -s -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/secrets" \
              -d '[{"name":"NODE_ENV","value":"production"}]'
            echo "NODE_ENV created"
          else
            echo "NODE_ENV already set"
          fi

      - name: Ensure Maestro E2E Credential Secrets
        id: maestro
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          MAESTRO_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
          E2E_PROVISIONING_SECRET: ${{ secrets.E2E_PROVISIONING_SECRET }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" maestro \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|repair:Repair Migration History|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|vault:Provision Sentry Vault Secret|secrets:Ensure Edge Function Secrets|maestro:Ensure Maestro E2E Credential Secrets|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }};repair=${{ steps.repair.outcome }};migrations=${{ steps.migrations.outcome }};config=${{ steps.config.outcome }};email=${{ steps.email.outcome }};signing=${{ steps.signing.outcome }};vault=${{ steps.vault.outcome }};secrets=${{ steps.secrets.outcome }}"
          # Maestro e2e credentials are project config, not repo files: keep
          # them in Edge Function secrets (Deno.env) and Supabase Vault
          # (vault.create_secret, read via public.read_secret()) — both
          # idempotent, values never rotated here.
          if [ -z "$MAESTRO_TEST_EMAIL" ] || [ -z "$MAESTRO_TEST_PASSWORD" ]; then
            echo "MAESTRO_TEST_EMAIL / MAESTRO_TEST_PASSWORD GitHub secrets not set — skipping"
            exit 0
          fi
          # Guard secret for the /api/auth/e2e/provision endpoint.
          if [ -n "$E2E_PROVISIONING_SECRET" ]; then
            PROV_JSON=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$E2E_PROVISIONING_SECRET")
            curl -sS -f -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/secrets" \
              -d "[{\"name\":\"E2E_PROVISIONING_SECRET\",\"value\":$PROV_JSON}]"
            echo "E2E_PROVISIONING_SECRET ensured as Edge Function secret"
          fi
          # 1. Edge Function secrets
          EMAIL_JSON=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$MAESTRO_TEST_EMAIL")
          PASS_JSON=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$MAESTRO_TEST_PASSWORD")
          curl -sS -f -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/secrets" \
            -d "[{\"name\":\"MAESTRO_TEST_EMAIL\",\"value\":$EMAIL_JSON},{\"name\":\"MAESTRO_TEST_PASSWORD\",\"value\":$PASS_JSON}]"
          echo "MAESTRO_TEST_EMAIL / MAESTRO_TEST_PASSWORD ensured as Edge Function secrets"
          # 2. Supabase Vault entries
          EMAIL_SQL=$(printf '%s' "$MAESTRO_TEST_EMAIL" | sed "s/'/''/g")
          PASS_SQL=$(printf '%s' "$MAESTRO_TEST_PASSWORD" | sed "s/'/''/g")
          SQL="SELECT vault.create_secret('${EMAIL_SQL}', 'MAESTRO_TEST_EMAIL') WHERE NOT EXISTS (SELECT 1 FROM vault.decrypted_secrets WHERE name = 'MAESTRO_TEST_EMAIL'); SELECT vault.create_secret('${PASS_SQL}', 'MAESTRO_TEST_PASSWORD') WHERE NOT EXISTS (SELECT 1 FROM vault.decrypted_secrets WHERE name = 'MAESTRO_TEST_PASSWORD');"
          PAYLOAD=$(python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$SQL")
          HTTP_CODE=$(curl -sS -o /tmp/maestro_vault_resp.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            -d "$PAYLOAD")
          cat /tmp/maestro_vault_resp.json; echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Maestro Vault provisioning failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "MAESTRO_TEST_EMAIL / MAESTRO_TEST_PASSWORD ensured in Vault"

      - name: Deploy Unified Edge API Function
        id: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" deploy \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|repair:Repair Migration History|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|vault:Provision Sentry Vault Secret|secrets:Ensure Edge Function Secrets|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }};repair=${{ steps.repair.outcome }};migrations=${{ steps.migrations.outcome }};config=${{ steps.config.outcome }};email=${{ steps.email.outcome }};signing=${{ steps.signing.outcome }};vault=${{ steps.vault.outcome }};secrets=${{ steps.secrets.outcome }}"
          supabase functions deploy api --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt

  post-deploy-verify:
    name: Post-Deploy Verification (Smoke & Schemathesis)
    needs: deploy
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        id: deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Hurl
        id: hurl
        uses: gacts/install-hurl@v1

      - name: Install Schemathesis (system python)
        id: python
        run: |
          # actions/setup-python hardcodes /Users/runner/hostedtoolcache on
          # macOS — unwritable on self-hosted runners. Schemathesis is the
          # only python dependency in this job; use the system interpreter.
          python3 -m pip install --quiet --break-system-packages schemathesis
          echo "$HOME/Library/Python/3.14/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          st --version || schemathesis --version

      - name: Hurl Health Check
        id: schemathesis
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Post-Deploy Verification (Smoke & Schemathesis)" schemathesis \
            "checkout:Checkout Repository|deno:Setup Deno|hurl:Setup Hurl|python:Setup Python|schemathesis:Install Schemathesis|hurl_gate:Hurl Gate (/health)|schema:Schemathesis (GET only)|smoke:Deno Smoke Test" \
            "checkout=${{ steps.checkout.outcome }};deno=${{ steps.deno.outcome }};hurl=${{ steps.hurl.outcome }};python=${{ steps.python.outcome }}"
          pip install schemathesis

      - name: Hurl Gate (/health)
        id: hurl_gate
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Post-Deploy Verification (Smoke & Schemathesis)" hurl_gate \
            "checkout:Checkout Repository|deno:Setup Deno|hurl:Setup Hurl|python:Setup Python|schemathesis:Install Schemathesis|hurl_gate:Hurl Gate (/health)|schema:Schemathesis (GET only)|smoke:Deno Smoke Test" \
            "checkout=${{ steps.checkout.outcome }};deno=${{ steps.deno.outcome }};hurl=${{ steps.hurl.outcome }};python=${{ steps.python.outcome }};schemathesis=${{ steps.schemathesis.outcome }}"
          hurl --test supabase/functions/api/smoke/health.hurl --variable base_url="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/api"

      - name: Schemathesis (GET only)
        id: schema
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Post-Deploy Verification (Smoke & Schemathesis)" schema \
            "checkout:Checkout Repository|deno:Setup Deno|hurl:Setup Hurl|python:Setup Python|schemathesis:Install Schemathesis|hurl_gate:Hurl Gate (/health)|schema:Schemathesis (GET only)|smoke:Deno Smoke Test" \
            "checkout=${{ steps.checkout.outcome }};deno=${{ steps.deno.outcome }};hurl=${{ steps.hurl.outcome }};python=${{ steps.python.outcome }};schemathesis=${{ steps.schemathesis.outcome }};hurl_gate=${{ steps.hurl_gate.outcome }}"
          schemathesis run --include-method GET supabase/functions/api/openapi.json --url "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/api" || true

      - name: Deno Smoke Test
        id: smoke
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Post-Deploy Verification (Smoke & Schemathesis)" smoke \
            "checkout:Checkout Repository|deno:Setup Deno|hurl:Setup Hurl|python:Setup Python|schemathesis:Install Schemathesis|hurl_gate:Hurl Gate (/health)|schema:Schemathesis (GET only)|smoke:Deno Smoke Test" \
            "checkout=${{ steps.checkout.outcome }};deno=${{ steps.deno.outcome }};hurl=${{ steps.hurl.outcome }};python=${{ steps.python.outcome }};schemathesis=${{ steps.schemathesis.outcome }};hurl_gate=${{ steps.hurl_gate.outcome }};schema=${{ steps.schema.outcome }}"
          cd supabase/functions/api
          deno install
          API_BASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/api" deno test --allow-env --allow-net smoke/e2e_smoke_test.ts
