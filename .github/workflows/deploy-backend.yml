name: Deploy Supabase Backend (Migrations & Edge API)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Deno Edge Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./supabase/functions/api
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        id: deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: TruffleHog Secret Scanner
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Security Audit
        id: audit
        run: |
          . ${{ github.workspace }}/.github/scripts/step-tree.sh
          step_tree "Verify Deno Edge Functions" audit \
            "checkout:Checkout Repository|deno:Setup Deno|audit:Security Audit|lint:Deno Lint|check:Deno Check (Type Safety)|tests:Deno Tests (Authorization Matrix & Security)" \
            "checkout=${{ steps.checkout.outcome }};deno=${{ steps.deno.outcome }}"
          ${{ github.workspace }}/scripts/security-audit.sh

      - name: Deno Lint
        id: lint
        run: |
          . ${{ github.workspace }}/.github/scripts/step-tree.sh
          step_tree "Verify Deno Edge Functions" lint \
            "checkout:Checkout Repository|deno:Setup Deno|audit:Security Audit|lint:Deno Lint|check:Deno Check (Type Safety)|tests:Deno Tests (Authorization Matrix & Security)" \
            "checkout=${{ steps.checkout.outcome }};deno=${{ steps.deno.outcome }};audit=${{ steps.audit.outcome }}"
          deno lint index.ts routes/ _shared/

      - name: Deno Check (Type Safety)
        id: check
        run: |
          . ${{ github.workspace }}/.github/scripts/step-tree.sh
          step_tree "Verify Deno Edge Functions" check \
            "checkout:Checkout Repository|deno:Setup Deno|audit:Security Audit|lint:Deno Lint|check:Deno Check (Type Safety)|tests:Deno Tests (Authorization Matrix & Security)" \
            "checkout=${{ steps.checkout.outcome }};deno=${{ steps.deno.outcome }};audit=${{ steps.audit.outcome }};lint=${{ steps.lint.outcome }}"
          deno check index.ts

      - name: Deno Tests (Authorization Matrix & Security)
        id: tests
        run: |
          . ${{ github.workspace }}/.github/scripts/step-tree.sh
          step_tree "Verify Deno Edge Functions" tests \
            "checkout:Checkout Repository|deno:Setup Deno|audit:Security Audit|lint:Deno Lint|check:Deno Check (Type Safety)|tests:Deno Tests (Authorization Matrix & Security)" \
            "checkout=${{ steps.checkout.outcome }};deno=${{ steps.deno.outcome }};audit=${{ steps.audit.outcome }};lint=${{ steps.lint.outcome }};check=${{ steps.check.outcome }}"
          deno test --allow-env --allow-net auth_test.ts jwt_test.ts metadata_test.ts playback_test.ts two_factor_test.ts webauthn_test.ts auth_matrix_test.ts contracts_test.ts

  deploy:
    name: Deploy to Supabase Production
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend-prod-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        id: cli
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Database Migrations
        id: migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" migrations \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }}"
          # Migrations are pushed via the Management API (--linked) using
          # only the access token — no DB password secret required.
          supabase link --project-ref $SUPABASE_PROJECT_ID --yes
          supabase db push --linked --include-all --yes

      - name: Apply Auth & Email Configuration
        id: config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" config \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }};migrations=${{ steps.migrations.outcome }}"
          # Push [auth] settings from supabase/config.toml — site_url,
          # redirect allow-list and the magic-link email template. Without
          # this, emailed sign-in links fall back to the dashboard default
          # site_url and never reach the web app.
          supabase link --project-ref $SUPABASE_PROJECT_ID --yes
          supabase config push --project-ref $SUPABASE_PROJECT_ID --yes

      - name: Ensure Email Provider Enabled
        id: email
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" email \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }};migrations=${{ steps.migrations.outcome }};config=${{ steps.config.outcome }}"
          # The hosted project had the email (password) provider disabled,
          # so GoTrue rejects every password login with "Email logins are
          # disabled". Idempotently enable it — sign-ups stay blocked via
          # enable_signup = false (invitation-only).
          CURRENT=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('external_email_enabled', 'absent'))")
          if [ "$CURRENT" != "True" ]; then
            curl -s -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
              -d '{"external_email_enabled": true}'
            echo "EXTERNAL_EMAIL_ENABLED -> true (was $CURRENT)"
          else
            echo "EXTERNAL_EMAIL_ENABLED already true"
          fi

      - name: Ensure 2FA Challenge Signing Key Secret
        id: signing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" signing \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }};migrations=${{ steps.migrations.outcome }};config=${{ steps.config.outcome }};email=${{ steps.email.outcome }}"
          # The 2FA challenge signing key is a project-level Edge Function
          # secret. Create it once if missing (idempotent — never rotated
          # here, otherwise in-flight login challenges would be rejected).
          EXISTING=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/secrets" \
            | python3 -c "import sys,json;print(any(s['name']=='2FA_CHALLENGE_SIGNING_KEY' for s in json.load(sys.stdin)))")
          if [ "$EXISTING" != "True" ]; then
            curl -s -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/secrets" \
              -d "[{\"name\":\"2FA_CHALLENGE_SIGNING_KEY\",\"value\":\"$(openssl rand -hex 32)\"}]"
            echo "2FA_CHALLENGE_SIGNING_KEY created"
          else
            echo "2FA_CHALLENGE_SIGNING_KEY already set"
          fi

      - name: Deploy Unified Edge API Function
        id: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Supabase Production" deploy \
            "checkout:Checkout Repository|cli:Setup Supabase CLI|migrations:Push Database Migrations|config:Apply Auth & Email Configuration|email:Ensure Email Provider Enabled|signing:Ensure 2FA Challenge Signing Key Secret|deploy:Deploy Unified Edge API Function" \
            "checkout=${{ steps.checkout.outcome }};cli=${{ steps.cli.outcome }};migrations=${{ steps.migrations.outcome }};config=${{ steps.config.outcome }};email=${{ steps.email.outcome }};signing=${{ steps.signing.outcome }}"
          supabase functions deploy api --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt