pre-commit:
  parallel: true
  commands:
    lint-and-check:
      glob: "*.ts"
      run: ./scripts/pre-commit.sh {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: ./scripts/commit-msg.sh {1}

pre-push:
  parallel: false
  commands:
    typecheck-and-test:
      run: deno check supabase/functions/api/index.ts && deno test -A supabase/functions/api/
