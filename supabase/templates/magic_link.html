<!DOCTYPE html>
<html>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #0b0b0d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="background-color: #0b0b0d; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellspacing="0" cellpadding="0" border="0" style="max-width: 480px; width: 100%">
            <tr>
              <td style="background-color: #17171a; border-radius: 16px; padding: 32px">
                <h1 style="margin: 0 0 8px 0; color: #f59e0b; font-size: 24px; font-weight: 700">audiobookphile</h1>
                <p style="margin: 0 0 20px 0; color: #f5f5f7; font-size: 16px; line-height: 1.5">
                  Sign in to your audiobook library with this magic link:
                </p>
                <p style="margin: 0 0 24px 0; text-align: center">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="
                      display: inline-block;
                      padding: 14px 28px;
                      background-color: #f59e0b;
                      color: #0b0b0d;
                      font-size: 16px;
                      font-weight: 700;
                      text-decoration: none;
                      border-radius: 12px;
                    "
                  >
                    Sign In
                  </a>
                </p>
                <p style="margin: 0; color: #a1a1a6; font-size: 13px; line-height: 1.5">
                  If the button doesn't work, copy and paste this link into your browser:<br />
                  <a href="{{ .ConfirmationURL }}" style="color: #f59e0b; word-break: break-all">{{ .ConfirmationURL }}</a>
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 8px 0 8px; text-align: center">
                <p style="margin: 0; color: #6e6e73; font-size: 12px">
                  This link expires shortly. If you didn't request it, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
